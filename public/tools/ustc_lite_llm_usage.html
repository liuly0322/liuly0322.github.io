<title>USTC LLM 用量面板</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* 设计令牌：石墨中性 + 青绿强调，仪表盘风格 */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EDF1F0;
  --ink:#131A19; --ink-2:#4E5A58; --ink-3:#7C8785;
  --line:#DCE3E1; --line-2:#C3CDCB;
  --accent:#0B6E63; --accent-soft:#DCEFEB;
  --good:#1B7F4B; --warn:#A15C00; --bad:#B3261E;
  --shadow:0 1px 2px rgba(19,26,25,.05), 0 10px 28px -20px rgba(19,26,25,.35);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --surface:#161D1C; --surface-2:#1D2625;
    --ink:#E7EDEB; --ink-2:#A3B0AD; --ink-3:#76827F;
    --line:#28312F; --line-2:#39443F;
    --accent:#4FD1BE; --accent-soft:#12312C;
    --good:#56C98A; --warn:#E0A33C; --bad:#F2716A;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#161D1C; --surface-2:#1D2625;
  --ink:#E7EDEB; --ink-2:#A3B0AD; --ink-3:#76827F;
  --line:#28312F; --line-2:#39443F;
  --accent:#4FD1BE; --accent-soft:#12312C;
  --good:#56C98A; --warn:#E0A33C; --bad:#F2716A;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left));
  padding-block:28px 56px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.eyebrow{
  margin:0; font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
}
h1{font-size:clamp(26px,5.2vw,36px);font-weight:600;letter-spacing:-.02em;margin-top:6px}
.lede{margin:8px 0 0;color:var(--ink-2);max-width:60ch}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:18px; box-shadow:var(--shadow);
}
.card h2{font-size:14px;font-weight:600;letter-spacing:.01em}
.card .sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}

/* ---- key 输入 ---- */
label.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-2);margin-bottom:7px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=password],input[type=text]{
  flex:1 1 240px; min-width:0; font-family:var(--mono); font-size:13px;
  padding:10px 12px; border:1px solid var(--line-2); border-radius:8px;
  background:var(--surface-2); color:var(--ink);
}
input:focus-visible,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{
  font-family:var(--sans); font-size:13.5px; font-weight:500; cursor:pointer;
  padding:10px 16px; border-radius:8px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink-2);
  transition:background .15s,border-color .15s,color .15s;
}
button:hover{border-color:var(--ink-3);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding-inline:22px}
button.primary:hover{background:var(--ink);border-color:var(--ink)}
button.primary[disabled]{opacity:.55;cursor:progress}
:root[data-theme="dark"] button.primary{color:#06110F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#06110F}}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.remember{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;margin-right:auto}
.remember input{accent-color:var(--accent);width:15px;height:15px}
.status{margin:12px 0 0;font-size:12.5px;line-height:1.5;min-height:0}
.status[data-tone=err]{color:var(--bad)}
.status[data-tone=ok]{color:var(--good)}
.status[data-tone=busy]{color:var(--ink-3)}
.note{margin:10px 0 0;font-size:12px;color:var(--ink-3);line-height:1.5}

/* ---- 空状态 ---- */
.empty{
  border:1px dashed var(--line-2); border-radius:12px; padding:34px 20px; text-align:center;
  color:var(--ink-3); font-size:13px; background:var(--surface);
}
.empty strong{display:block;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:6px}

/* ---- 额度窗口（主角）---- */
.wins{display:flex;flex-direction:column;gap:17px;margin-top:14px}
.win-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.win-label{font-size:13.5px;font-weight:600}
.win-state{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:999px;margin-left:9px;vertical-align:1px}
.win[data-tone=ok] .win-state{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.win[data-tone=warn] .win-state{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.win[data-tone=bad] .win-state{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.win-pct{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.win[data-tone=warn] .win-pct{color:var(--warn)}
.win[data-tone=bad] .win-pct{color:var(--bad)}
.win-bar{height:9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:9px 0 7px}
.win-bar > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.win[data-tone=warn] .win-bar > i{background:var(--warn)}
.win[data-tone=bad] .win-bar > i{background:var(--bad)}
.win-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.win-foot b{font-family:var(--mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.win-reset{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.scope{font-size:11px;font-family:var(--mono);color:var(--ink-3);margin-left:7px}

/* ---- 今日 token ---- */
.big-sm{font-family:var(--mono);font-size:clamp(24px,6vw,30px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big-sm .u{font-size:.5em;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.split .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.split .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin:3px 0 6px}
.split .v small{font-size:11px;font-weight:400;color:var(--ink-3);font-family:var(--sans)}
.split .bar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.split .bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.split > div:nth-child(1) .bar i{background:var(--accent)}
.split > div:nth-child(2) .bar i{background:var(--ink-3)}
.meta{font-size:12.5px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- 指标块 ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:5px;letter-spacing:-.01em}
.tile .v small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}

/* ---- 图表 ---- */
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.plot{position:relative;margin-top:10px;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--ink-3);font-size:11px;font-family:var(--mono)}
.gridline{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.bar{transition:opacity .12s}
.tip{
  position:absolute;pointer-events:none;z-index:3;opacity:0;
  background:var(--ink);color:var(--bg);border-radius:7px;padding:7px 10px;
  font-size:12px;font-family:var(--mono);line-height:1.5;white-space:nowrap;
  transition:opacity .1s;transform:translate(-50%,-115%);
}
.tip.on{opacity:1}
.tip b{font-weight:600}
.ranges{display:flex;gap:6px}
.ranges button{padding:5px 11px;font-size:12px;border-radius:999px;font-family:var(--mono)}
.ranges button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---- 表格 ---- */
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:520px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:var(--mono)}
thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line-2)}
td.num{font-family:var(--mono)}

/* ---- 身份 ---- */
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 22px;margin-top:14px}
.idgrid .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
.idgrid .v{font-size:13.5px;margin-top:3px;word-break:break-word}
.idgrid .v.mono{font-family:var(--mono);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.foot{font-size:12px;color:var(--ink-3);line-height:1.6;max-width:66ch}
.foot code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">USTC · LiteLLM 代理</p>
    <h1>用量面板</h1>
  </header>

  <section class="card">
    <label class="lbl" for="key">API KEY</label>
    <div class="row">
      <input id="key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <button id="reveal" type="button" aria-pressed="false">显示</button>
    </div>
    <div class="actions">
      <label class="remember"><input id="remember" type="checkbox" checked> 记住在这台设备</label>
      <button id="query" class="primary" type="button">查询</button>
      <button id="clear" type="button">清除</button>
    </div>
    <p id="status" class="status" hidden></p>
  </section>

  <div id="empty" class="empty">
    <strong>还没有查询</strong>
    查询后会显示：3 小时 / 12 小时 / 24 小时额度窗口的消耗进度与重置倒计时、每日 token 用量、逐日明细。
  </div>

  <section id="results" hidden style="display:flex;flex-direction:column;gap:20px">
    <div class="card">
      <div class="hero-top">
        <div>
          <h2>额度窗口</h2>
          <p class="sub" id="winSub">—</p>
        </div>
        <p class="meta" id="nextReset" style="margin:0;text-align:right"></p>
      </div>
      <div class="wins" id="wins"></div>
    </div>

    <!-- 今日 token -->
    <div class="card">
      <div class="hero-top">
        <div>
          <h2>今日 token</h2>
          <p class="sub">输入 + 输出</p>
        </div>
        <div style="text-align:right">
          <div class="big-sm" id="tokToday">—</div>
          <p class="meta" id="tokMeta" style="margin:2px 0 0"></p>
        </div>
      </div>
      <div class="split">
        <div>
          <div class="k">输入</div>
          <div class="v" id="inToday">—</div>
          <div class="bar"><i id="inBar" style="width:0"></i></div>
        </div>
        <div>
          <div class="k">输出</div>
          <div class="v" id="outToday">—</div>
          <div class="bar"><i id="outBar" style="width:0"></i></div>
        </div>
      </div>
      <p class="meta" id="cacheLine" style="margin-top:14px"></p>
    </div>

    <!-- 指标 -->
    <div class="tiles" id="tiles"></div>

    <!-- token 图 -->
    <div class="card">
      <div class="chart-head">
        <div>
          <h2>每日 token</h2>
          <p class="sub">输入 + 输出</p>
        </div>
        <div class="ranges" id="ranges">
          <button type="button" data-days="7" aria-pressed="false">7 天</button>
          <button type="button" data-days="14" aria-pressed="true">14 天</button>
          <button type="button" data-days="30" aria-pressed="false">30 天</button>
        </div>
      </div>
      <div class="plot" id="tokPlot"></div>
    </div>

    <!-- 请求图 -->
    <div class="card">
      <div class="chart-head">
        <div>
          <h2>每日请求</h2>
          <p class="sub">成功与失败的调用次数</p>
        </div>
        <div class="legend">
          <span><i class="swatch" style="background:var(--accent)"></i>成功</span>
          <span><i class="swatch" style="background:var(--bad)"></i>失败</span>
        </div>
      </div>
      <div class="plot" id="reqPlot"></div>
    </div>

    <!-- 明细 -->
    <div class="card">
      <h2>每日明细</h2>
      <p class="sub">缓存命中 = 命中前缀缓存的输入 token 占比</p>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th scope="col">日期</th><th scope="col">输入 tok</th><th scope="col">输出 tok</th><th scope="col">合计</th>
            <th scope="col">缓存命中</th><th scope="col">成功</th><th scope="col">失败</th><th scope="col">花费</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>

    <!-- 授权模型 -->
    <div class="card">
      <h2>授权模型</h2>
      <div id="models"></div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  var API = "https://api.llm.ustc.edu.cn";
  var LS = "ustc.llm.key";
  var el = function(id){ return document.getElementById(id); };
  var state = { key:"", days:14, rows:[], id:null, lastKey:null, lastUser:null };

  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  /* ---------- 存储 ---------- */
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  /* ---------- 格式化 ---------- */
  function money(n){
    if(n==null||!isFinite(n)) return "—";
    var a=Math.abs(n);
    if(a===0) return "$0";
    if(a<1) return "$"+n.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
    if(a<100) return "$"+n.toFixed(2);
    return "$"+n.toFixed(1);
  }
  function tok(n){
    if(n==null||!isFinite(n)) return "—";
    if(n>=1e8) return (n/1e8).toFixed(2)+"亿";
    if(n>=1e4) return (n/1e4).toFixed(1)+"万";
    return String(Math.round(n));
  }
  function tokUnit(n){
    if(n==null||!isFinite(n)) return null;
    if(n>=1e8) return "亿"; if(n>=1e4) return "万"; return null;
  }
  function tokNum(n){
    if(n==null||!isFinite(n)) return "—";
    if(n>=1e8) return (n/1e8).toFixed(2); if(n>=1e4) return (n/1e4).toFixed(1); return String(Math.round(n));
  }
  function int(n){ return (n==null||!isFinite(n))?"—":Math.round(n).toLocaleString("en-US"); }
  function ymd(d){
    var m=d.getMonth()+1, day=d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
  }
  function fromYmd(s){
    var p=String(s).split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function md(s){ var d=fromYmd(s); return (d.getMonth()+1)+"/"+d.getDate(); }

  /* ---------- 请求 ---------- */
  function get(path,key){
    return fetch(API+path,{ headers:{ "Authorization":"Bearer "+key } }).then(function(res){
      return res.text().then(function(t){
        var body=null; try{ body=JSON.parse(t); }catch(e){}
        if(!res.ok){
          var e=new Error("HTTP "+res.status); e.status=res.status; e.body=body; throw e;
        }
        return body;
      });
    });
  }
  function humanErr(e){
    if(e && e.status===401) return "Key 无效、已过期，或不被这个代理接受。";
    if(e && e.status===403) return "这个 key 没有查询该信息的权限。";
    if(e && e.status) return "请求失败（HTTP "+e.status+"）。";
    return "连不上代理。检查网络，或浏览器/扩展拦截了跨域请求。";
  }

  /* ---------- 主流程 ---------- */
  function query(){
    var key = el("key").value.trim();
    if(!key){ setStatus("请先粘贴 API key。","err"); el("key").focus(); return; }
    state.key = key;
    if(el("remember").checked){ lsSet(LS,key); } else { lsDel(LS); }
    setStatus("查询中…","busy");
    var btn=el("query"); btn.disabled=true;

    var end = ymd(new Date());
    var start = ymd(new Date(Date.now()-(state.days-1)*864e5));
    var q = "/user/daily/activity?start_date="+start+"&end_date="+end;

    Promise.all([ get("/key/info",key), get("/user/info",key), get(q,key) ])
      .then(function(r){
        state.lastKey=r[0]; state.lastUser=r[1];
        state.rows = normalize(r[2]);
        render(r[0],r[1]);
        setStatus("已更新 · "+new Date().toLocaleTimeString(),"ok");
      })
      .catch(function(e){ setStatus(humanErr(e),"err"); })
      .then(function(){ btn.disabled=false; });
  }

  function normalize(daily){
    var out=[];
    if(daily && Array.isArray(daily.results)){
      daily.results.forEach(function(r){
        var m = r && r.metrics ? r.metrics : {};
        out.push({
          date: r && r.date ? r.date : "",
          spend: +m.spend || 0,
          ok: +m.successful_requests || 0,
          fail: +m.failed_requests || 0,
          pin: +m.prompt_tokens || 0,
          pout: +m.completion_tokens || 0,
          cache: +m.cache_read_input_tokens || 0,
          save: +m.prompt_caching_savings_spend || 0,
          total: +m.total_tokens || 0
        });
      });
    }
    out.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    return out;
  }

  function setStatus(msg,tone){
    var s=el("status");
    s.hidden=false; s.textContent=msg;
    if(tone) s.setAttribute("data-tone",tone); else s.removeAttribute("data-tone");
  }

  /* ---------- 渲染 ---------- */
  function render(k,u){
    el("empty").hidden = true;
    el("results").hidden = false;
    renderWindows(k,u);
    renderTokens();
    renderTiles(k,u);
    renderCharts();
    renderTable();
    renderModels(k);
  }

  /* 把时长的解析结果统一成毫秒 */
  function durMs(s){
    var m=/^\s*(\d+)\s*(ms|s|m|h|d|w)?\s*$/.exec(String(s||""));
    if(!m) return null;
    var n=+m[1], u=(m[2]||"d").toLowerCase();
    return n*({ms:1,s:1e3,m:60e3,h:3600e3,d:86400e3,w:604800e3}[u]||86400e3);
  }
  function resetLabel(iso){
    if(!iso) return "—";
    var d=new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    var now=new Date(), diff=d-now;
    var hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2);
    var t = d.toDateString()===now.toDateString() ? (hh+":"+mm) : ((d.getMonth()+1)+"/"+d.getDate()+" "+hh+":"+mm);
    if(diff<=0) return t+" · 即将重置";
    var h=Math.floor(diff/3600e3), mi=Math.round((diff%3600e3)/60e3);
    return t+" · 还有 "+(h>0?h+" 小时 ":"")+mi+" 分";
  }
  function renderWindows(k,u){
    var ki = k && k.info ? k.info : {};
    var ui = u && u.user_info ? u.user_info : {};
    var live = ki.budget_limits_usage || {};
    var wins=[];
    /* 时长最长者放最下面，短的在上（3h → 12h → 24h） */
    (ki.budget_limits||[]).forEach(function(b){
      var d=b.budget_duration||"";
      var used = live[d] ? +live[d].current_spend : null;
      wins.push({ label:d||"窗口", scope:"key", max:+b.max_budget, used:used, reset:b.reset_at });
    });
    if(ui.max_budget!=null){
      wins.push({ label: ui.budget_duration||"用户级", scope:"user", max:+ui.max_budget,
                  used: isFinite(+ui.spend)?+ui.spend:null, reset: ui.budget_reset_at });
    }
    wins.sort(function(a,b){ return (durMs(a.label)||0)-(durMs(b.label)||0); });

    if(!wins.length){
      el("wins").innerHTML='<p class="meta">这个 key 没有配置额度窗口。</p>';
      el("winSub").textContent="未设上限";
      el("nextReset").textContent="";
      return;
    }
    el("winSub").textContent = wins.length+" 个窗口叠加，任一用尽即会被限流";

    var nearest=null;
    el("wins").innerHTML = wins.map(function(w){
      var pct = (w.max>0 && w.used!=null) ? Math.max(0,Math.min(1,w.used/w.max)) : null;
      var tone = pct==null?"ok":pct>=0.9?"bad":pct>=0.8?"warn":"ok";
      var state = pct==null?"—":pct>=1?"已用尽":pct>=0.9?"即将用尽":pct>=0.8?"注意":"正常";
      var r=new Date(w.reset); if(!isNaN(r.getTime()) && (!nearest || r<nearest)) nearest=r;
      var left = w.max!=null&&w.used!=null ? Math.max(0,w.max-w.used) : null;
      return '<div class="win" data-tone="'+tone+'">'+
        '<div class="win-head">'+
          '<div><span class="win-label">'+esc(w.label)+'</span>'+
          (w.scope==="user"?'<span class="scope">用户级</span>':'<span class="scope">key 级</span>')+
          '<span class="win-state">'+esc(state)+'</span></div>'+
          '<div class="win-pct">'+(pct==null?"—":(pct*100).toFixed(1)+"%")+'</div>'+
        '</div>'+
        '<div class="win-bar"><i style="width:'+(pct==null?0:(pct*100).toFixed(2))+'%"></i></div>'+
        '<div class="win-foot">'+
          '<span>已用 <b>'+esc(money(w.used))+'</b> / <b>'+esc(money(w.max))+'</b>'+
            (left!=null?' · 剩 <b>'+esc(money(left))+'</b>':'')+'</span>'+
          '<span class="win-reset">'+esc(resetLabel(w.reset))+'</span>'+
        '</div></div>';
    }).join("");

    el("nextReset").innerHTML = nearest && !isNaN(nearest.getTime())
      ? "最近重置<br><b>"+esc(nearest.toLocaleString(undefined,{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}))+"</b>"
      : "";
  }

  /* 今日 token（次要） */
  function renderTokens(){
    var rows=state.rows.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
    var today=rows.length?rows[0]:null;
    var inTok=today?today.pin:null, outTok=today?today.pout:null;
    var total=(inTok==null||outTok==null)?null:(inTok+outTok);
    var u=tokUnit(total||0);

    el("tokToday").innerHTML = esc(u?tokNum(total):(total==null?"—":int(total))) + (u?'<span class="u">'+u+'</span>':'');
    var base=Math.max(inTok||0,outTok||0,1);
    var share=(total>0&&inTok!=null)?(inTok/total*100).toFixed(1)+"%":"—";
    el("inToday").innerHTML = esc(tok(inTok)) + ' <small>占 '+esc(share)+'</small>';
    el("outToday").textContent = tok(outTok);
    el("inBar").style.width=((inTok||0)/base*100).toFixed(1)+"%";
    el("outBar").style.width=((outTok||0)/base*100).toFixed(1)+"%";

    var hit = (today && today.pin>0) ? (today.cache/today.pin*100).toFixed(1)+"%" : "—";
    el("tokMeta").innerHTML = today ? int(today.ok+today.fail)+" 次调用" : "今天还没有记录";
    el("cacheLine").innerHTML = today
      ? "缓存命中 <b>"+esc(hit)+"</b> · 今日花费 <b>"+esc(money(today.spend))+"</b>"
      : "";
  }

  function renderTiles(k,u){
    var rows=state.rows.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
    var today=rows.length?rows[0]:null;
    var days=rows.length;
    var sumTok=0, sumOk=0, sumFail=0, sumSpend=0;
    rows.forEach(function(r){ sumTok+=r.pin+r.pout; sumOk+=r.ok; sumFail+=r.fail; sumSpend+=r.spend; });
    var t=[
      { k:"今日调用", v: today?int(today.ok+today.fail):"—", s: today?("失败 "+int(today.fail)):"" },
      { k:"日均 token", v: days?tok(sumTok/days):"—", s: days?("近 "+days+" 天"):"" },
      { k:days+" 天合计", v: days?tok(sumTok):"—", s: days?int(sumOk)+" 成功":"" },
      { k:days+" 天花费", v: money(sumSpend), s: days?(money(sumSpend/days)+"/天"):"" }
    ];
    el("tiles").innerHTML = t.map(function(x){
      return '<div class="tile"><div class="k">'+esc(x.k)+'</div><div class="v">'+esc(x.v)+
             (x.s?'<small>'+esc(x.s)+'</small>':'')+'</div></div>';
    }).join("");
  }

  /* ---------- 图表 ---------- */
  function niceMax(v){
    if(!(v>0)) return 1;
    var p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p;
    var m = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
    return m*p;
  }
  function barPath(x,y,w,h,r){
    if(h<=0) return "";
    r=Math.min(r,w/2,h);
    return "M"+x+","+(y+h)+" L"+x+","+(y+r)+" Q"+x+","+y+" "+(x+r)+","+y+
           " L"+(x+w-r)+","+y+" Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+" L"+(x+w)+","+(y+h)+" Z";
  }
  function ease(t){ return t<0?0:t>1?1:t; }
  function plotWidth(host){
    var w = host.clientWidth;
    return Math.max(260, w || 640);
  }

  function renderCharts(){ renderTok(); renderReq(); }

  function renderTok(){
    var host=el("tokPlot"), rows=state.rows;
    if(!rows.length){ host.innerHTML='<p class="meta" style="padding:18px 0">这个区间没有记录。</p>'; return; }
    var W=plotWidth(host), H=210;
    var padL=58, padR=14, padT=16, padB=30;
    var pw=W-padL-padR, ph=H-padT-padB;
    var maxV=niceMax(Math.max.apply(null,rows.map(function(r){ return r.pin+r.pout; })));
    var n=rows.length, slot=pw/n, bw=Math.min(46,slot*0.62);
    var maxIdx=0; rows.forEach(function(r,i){ if((r.pin+r.pout)>(rows[maxIdx].pin+rows[maxIdx].pout)) maxIdx=i; });
    var step=Math.ceil(n/7);
    var yOf=function(v){ return padT+ph-ph*(v/maxV); };
    var grid=[0,0.5,1].map(function(f){
      var v=maxV*f, y=yOf(v);
      return '<line class="gridline" x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
             '<text class="tick" x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+esc(tokNum(v))+'</text>';
    }).join("");
    var bars="", hits="", labels="";
    rows.forEach(function(r,i){
      var v=r.pin+r.pout;
      var x=padL+slot*i+(slot-bw)/2;
      var h=v<=0?0:Math.max(2,ph*(v/maxV));
      var y=padT+ph-h;
      var on=(i===maxIdx && v>0);
      bars+='<path class="bar" d="'+barPath(x,y,bw,h,4)+'" fill="var(--accent)" fill-opacity="'+(on?1:0.72)+'"/>';
      if(on) labels+='<text class="tick" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" fill="var(--ink)" style="font-weight:600">'+esc(tok(v))+'</text>';
      if(i%step===0 || i===n-1)
        labels+='<text class="tick" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(md(r.date))+'</text>';
      hits+='<rect class="hit" x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+ph+'" fill="transparent" data-i="'+i+'"/>';
    });
    host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="每日 token">'+
      grid+bars+labels+hits+'</svg><div class="tip" id="tokTip"></div>';
    wireTip(host,"tokTip",function(i){
      var r=rows[i], v=r.pin+r.pout;
      var hit=r.pin>0?(r.cache/r.pin*100).toFixed(1)+"%":"—";
      return '<b>'+esc(r.date)+'</b><br>合计 '+esc(tok(v))+
             '<br>输入 '+esc(tok(r.pin))+' · 输出 '+esc(tok(r.pout))+
             '<br>缓存命中 '+esc(hit);
    });
  }

  function renderReq(){
    var host=el("reqPlot"), rows=state.rows;
    if(!rows.length){ host.innerHTML='<p class="meta" style="padding:18px 0">这个区间没有记录。</p>'; return; }
    var W=plotWidth(host), H=210;
    var padL=52, padR=14, padT=22, padB=30;
    var pw=W-padL-padR, ph=H-padT-padB;
    var maxV=niceMax(Math.max.apply(null,rows.map(function(r){ return r.ok+r.fail; })));
    var n=rows.length, slot=pw/n, bw=Math.min(46,slot*0.62);
    var step=Math.ceil(n/7);
    var grid=[0,0.5,1].map(function(f){
      var v=maxV*f, y=padT+ph-ph*(v/maxV);
      return '<line class="gridline" x1="'+padL+'" x2="'+(padL+pw)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'+
             '<text class="tick" x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+esc(int(v))+'</text>';
    }).join("");
    var bars="", hits="", labels="";
    rows.forEach(function(r,i){
      var x=padL+slot*i+(slot-bw)/2;
      var total=r.ok+r.fail;
      var ht=total<=0?0:ph*(total/maxV);
      var yBase=padT+ph;
      var hFail=total<=0?0:ht*(r.fail/total);
      var hOk=ht-hFail;
      var yFailTop=yBase-hFail, yOkTop=yFailTop-hOk-2; /* 2px 间隙 */
      if(hFail>0) bars+='<path d="'+barPath(x,yFailTop,bw,hFail,0)+'" fill="var(--bad)" fill-opacity=".85"/>';
      if(hOk>0)   bars+='<path d="'+barPath(x,yOkTop,bw,Math.max(0,hOk),4)+'" fill="var(--accent)"/>';
      if(i%step===0 || i===n-1)
        labels+='<text class="tick" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(md(r.date))+'</text>';
      hits+='<rect class="hit" x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+ph+'" fill="transparent" data-i="'+i+'"/>';
    });
    host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="每日请求">'+
      grid+bars+labels+hits+'</svg><div class="tip" id="reqTip"></div>';
    wireTip(host,"reqTip",function(i){
      var r=rows[i];
      return '<b>'+esc(r.date)+'</b><br>成功 '+esc(int(r.ok))+' · 失败 '+esc(int(r.fail));
    });
  }

  function wireTip(host,tipId,fn){
    var tip=el(tipId), svg=host.querySelector("svg");
    host.querySelectorAll(".hit").forEach(function(h){
      h.addEventListener("mouseenter",function(){
        var i=+h.getAttribute("data-i");
        tip.innerHTML=fn(i);
        var x=+h.getAttribute("x")+ +h.getAttribute("width")/2;
        var vb=+svg.getAttribute("viewBox").split(" ")[2];
        var scale=host.clientWidth/vb;
        tip.style.left=Math.max(52,Math.min(host.clientWidth-52,x*scale))+"px";
        tip.style.top=(+h.getAttribute("y")*scale)+"px";
        tip.classList.add("on");
      });
      h.addEventListener("mouseleave",function(){ tip.classList.remove("on"); });
    });
    host.addEventListener("mouseleave",function(){ tip.classList.remove("on"); });
  }

  /* ---------- 明细表 ---------- */
  function renderTable(){
    var rows=state.rows;
    if(!rows.length){ el("tbody").innerHTML='<tr><td colspan="8">没有记录</td></tr>'; el("tfoot").innerHTML=""; return; }
    var tot={spend:0,ok:0,fail:0,pin:0,pout:0,cache:0};
    el("tbody").innerHTML = rows.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; }).map(function(r){
      tot.spend+=r.spend; tot.ok+=r.ok; tot.fail+=r.fail; tot.pin+=r.pin; tot.pout+=r.pout; tot.cache+=r.cache;
      var v=r.pin+r.pout;
      var hit = r.pin>0 ? (r.cache/r.pin*100) : null;
      return '<tr><td>'+esc(r.date)+'</td>'+
        '<td class="num">'+esc(tok(r.pin))+'</td>'+
        '<td class="num">'+esc(tok(r.pout))+'</td>'+
        '<td class="num" style="font-weight:600">'+esc(tok(v))+'</td>'+
        '<td class="num">'+(hit==null?"—":hit.toFixed(1)+"%")+'</td>'+
        '<td class="num">'+esc(int(r.ok))+'</td>'+
        '<td class="num" style="color:'+(r.fail>0?"var(--bad)":"inherit")+'">'+esc(int(r.fail))+'</td>'+
        '<td class="num">'+esc(money(r.spend))+'</td></tr>';
    }).join("");
    var totTok=tot.pin+tot.pout;
    var hitAll = tot.pin>0 ? (tot.cache/tot.pin*100).toFixed(1)+"%" : "—";
    el("tfoot").innerHTML='<tr><td>合计</td>'+
      '<td class="num">'+esc(tok(tot.pin))+'</td>'+
      '<td class="num">'+esc(tok(tot.pout))+'</td>'+
      '<td class="num">'+esc(tok(totTok))+'</td>'+
      '<td class="num">'+esc(hitAll)+'</td>'+
      '<td class="num">'+esc(int(tot.ok))+'</td>'+
      '<td class="num">'+esc(int(tot.fail))+'</td>'+
      '<td class="num">'+esc(money(tot.spend))+'</td></tr>';
  }

  /* ---------- 授权模型 ---------- */
  function renderModels(k){
    var ki = k && k.info ? k.info : {};
    var meta = ki.metadata || {};
    var models = meta.authorized_models||[];
    el("models").innerHTML = models.length
      ? '<div class="chips">'+models.map(function(m){ return '<span class="chip">'+esc(m)+'</span>'; }).join("")+'</div>'
      : '<p class="meta">没有读到授权模型列表。</p>';
  }

  /* ---------- 事件 ---------- */
  el("query").addEventListener("click", query);
  el("key").addEventListener("keydown", function(e){ if(e.key==="Enter") query(); });
  el("reveal").addEventListener("click", function(){
    var i=el("key"), on=i.type==="password";
    i.type = on?"text":"password";
    this.textContent = on?"隐藏":"显示";
    this.setAttribute("aria-pressed", on?"true":"false");
  });
  el("clear").addEventListener("click", function(){
    el("key").value=""; lsDel(LS);
    el("results").hidden=true; el("empty").hidden=false;
    el("status").hidden=true; el("key").focus();
  });
  el("ranges").addEventListener("click", function(e){
    var b=e.target.closest("button[data-days]"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
    state.days = +b.getAttribute("data-days");
    if(state.key) query();
  });
  el("remember").addEventListener("change", function(){
    if(this.checked && state.key) lsSet(LS,state.key); else lsDel(LS);
  });

  var rt=null;
  window.addEventListener("resize", function(){
    if(el("results").hidden) return;
    clearTimeout(rt);
    rt=setTimeout(renderCharts, 120);
  });

  /* ---------- 启动 ---------- */
  (function boot(){
    var saved = lsGet(LS);
    if(saved){ el("key").value = saved; setStatus("已载入上次保存的 key，点「查询」查看。","busy"); }
  })();
})();
</script>
